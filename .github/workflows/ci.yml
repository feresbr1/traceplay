name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Committed CLI bundle is up to date
        run: git diff --exit-code -- dist/cli
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  cli:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Render an example with the bundled CLI
        run: node dist/cli/traceplay.mjs check examples/heapsort.trace.js && node dist/cli/traceplay.mjs render examples/heapsort.trace.js -o heap.html
